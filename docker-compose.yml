# Juice Shop + product AI assistant (FastAPI) + Chroma vector DB
#
#   docker compose up -d --build
#
#   Juice Shop (with chat widget)  http://localhost:3000
#   AI assistant API / Swagger     http://localhost:8000/docs
#   Chroma                         http://localhost:8001
#
# The browser calls the assistant at http://localhost:8000 (frontend environment `aiAssistantUrl`),
# and the assistant reaches Juice Shop and Chroma over the internal compose network.

name: juice-shop-ai

services:
  juice-shop:
    build: .
    image: juice-shop-local:latest
    container_name: juice-shop
    ports:
      - "3000:3000"
    healthcheck:
      # distroless image: no shell/curl, so use the bundled Node.js
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://localhost:3000/api/Products').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
    restart: unless-stopped

  chroma:
    image: chromadb/chroma:1.5.9
    container_name: juice-shop-chroma
    ports:
      - "8001:8000"
    volumes:
      - chroma-data:/data
    environment:
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped

  ai-assistant:
    build: ./ai_assistant
    image: juice-shop-ai-assistant:latest
    container_name: juice-shop-ai-assistant
    ports:
      - "8000:8000"
    env_file:
      - .env.openai          # provides OPENAI_API_KEY at runtime (never baked into the image)
    environment:
      - JUICE_SHOP_URL=http://juice-shop:3000
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://localhost:4200
    depends_on:
      juice-shop:
        condition: service_healthy
      chroma:
        condition: service_started
    restart: unless-stopped

volumes:
  chroma-data:
    name: ai_assistant_chroma-data   # reuse the existing embeddings (created by the earlier ai_assistant/ compose)
